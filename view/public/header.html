<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{$title|default='墨屿书屋 MOYU BOOKS'}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page">

<div class="topbar">
    <div class="wrap topbar-inner">
        <span class="topbar-note">满 59 元包邮 · 48 小时内发货</span>
        <div class="topbar-links">
            {if $user}
                <span>你好，{$user.nickname}</span>
                <a href="/logout">退出登录</a>
            {else /}
                <a href="/login">登录 / 注册</a>
            {/if}
        </div>
    </div>
</div>

<header class="site-header" id="site-header">
    <div class="wrap header-inner">
        <a class="logo" href="/">
            <span class="logo-mark">墨</span>
            <span class="logo-text">墨屿书屋<small>MOYU BOOKS</small></span>
        </a>
        <nav class="main-nav">
            <a href="/" data-nav="/" class="{if $nav=='/'}active{/if}">首页</a>
            <a href="/books" data-nav="/books" class="{if $nav=='/books'}active{/if}">全部图书</a>
            <a href="/orders" data-nav="/orders" class="{if $nav=='/orders'}active{/if}">我的订单</a>
        </nav>
        <div class="header-actions">
            <a class="icon-btn" href="/books" title="搜索图书">🔍</a>
            <a class="icon-btn" href="/cart" title="购物车" style="position:relative">
                🛒<span class="cart-badge" id="cart-badge">{if $cartCount > 0}{$cartCount}{/if}</span>
            </a>
            <a class="btn-login" href="{if $user}/orders{else /}/login{/if}">{if $user}{$user.nickname}{else /}登录{/if}</a>
        </div>
    </div>
</header>

<main id="app" class="page-enter">
    <div class="wrap">
