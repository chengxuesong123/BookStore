{include file="../public/header" /}

<div class="admin-shell">
    <div class="admin-head">
        <div>
            <h1>分类管理</h1>
            <div class="who">共 {$count} 个分类，排序数字越小越靠前</div>
        </div>
        <div style="display:flex;gap:10px">
            <a class="btn btn-ghost btn-sm" href="/admin">返回概览</a>
        </div>
    </div>

    <div class="admin-tabs">
        <a href="/admin">概览</a>
        <a href="/admin/books">图书管理</a>
        <a href="/admin/orders">订单管理</a>
        <a class="active" href="/admin/categories">分类管理</a>
    </div>

    <div class="info-card">
        <h3>新增分类</h3>
        <form method="post" action="/admin/categories/save" class="form-grid" style="align-items:end">
            {:csrf_field()}
            <div class="field">
                <label>分类名<span class="req">*</span></label>
                <input name="name" placeholder="例如：科幻">
            </div>
            <div class="field">
                <label>排序</label>
                <input name="sort" type="number" value="0">
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">新增</button>
            </div>
        </form>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>分类名</th>
                <th>排序</th>
                <th>图书数</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            {volist name="categories" id="c"}
            <tr>
                <td>{$c.id}</td>
                <td>
                    <form method="post" action="/admin/categories/save" style="display:flex;gap:8px">
                        {:csrf_field()}
                        <input type="hidden" name="id" value="{$c.id}">
                        <input name="name" value="{$c.name}" style="max-width:160px">
                        <input name="sort" type="number" value="{$c.sort}" style="max-width:70px">
                        <button class="btn btn-sm btn-ghost" type="submit">保存</button>
                    </form>
                </td>
                <td>{$c.sort}</td>
                <td>{$counts[$c.id]}</td>
                <td>
                    <form method="post" action="/admin/categories/{$c.id}/delete">
                        {:csrf_field()}
                        <button class="btn btn-sm btn-ghost" type="submit"
                                data-confirm="删除分类「{$c.name}」？分类下有书时会被拒绝。">删除</button>
                    </form>
                </td>
            </tr>
            {/volist}
            </tbody>
        </table>
    </div>
</div>

{include file="../public/footer" /}
