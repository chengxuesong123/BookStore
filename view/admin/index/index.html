{include file="../public/header" /}

<div class="admin-shell">
    <div class="admin-head">
        <div>
            <h1>后台管理</h1>
            <div class="who">当前管理员：{$user.nickname}（{$user.email}）</div>
        </div>
        <div style="display:flex;gap:10px">
            <a class="btn btn-ghost btn-sm" href="/">返回前台</a>
            <a class="btn btn-sm btn-navy" href="/logout">退出登录</a>
        </div>
    </div>

    <div class="stat-grid">
        {volist name="stats" id="s"}
        <div class="stat-card {if !empty($s.accent)}accent{/if}">
            <div class="k">{$s.k}</div>
            <div class="v">{$s.v}</div>
        </div>
        {/volist}
    </div>

    <div class="admin-tabs">
        <a class="active" href="/admin">概览</a>
        <a href="/admin/books">图书管理</a>
        <a href="/admin/orders">订单管理</a>
        <a href="/admin/categories">分类管理</a>
    </div>

    <div class="info-card">
        <h3>快速上手</h3>
        <p class="muted">左侧功能逐步开放：图书管理可上下架与编辑，订单管理可发货、设为完成。后台入口不在前台导航出现，只有管理员账号能进入。</p>
    </div>
</div>


{include file="../public/footer" /}
